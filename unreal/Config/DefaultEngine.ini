;
; NOTE: /Game/Maps/TitleMap does not exist until the editor step in
; SPEC.md ("WHAT TO ADD", step 1) creates it. The Editor will warn
; about the missing startup map until then; that warning is expected
; for this text-authored template and is not an error in the C++.
; The TitleMap's World Settings GameMode override (AShellGameMode)
; is also set in that step - there is deliberately no global default
; GameMode here, so gameplay maps choose their own.

[/Script/Engine.Engine]
GameInstanceClass=/Script/GameShell.ShellGameInstance

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/TitleMap.TitleMap
GameDefaultMap=/Game/Maps/TitleMap.TitleMap
